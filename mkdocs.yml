site_name: CVTools
site_description: Suite de herramientas de visión por computadora para preparación de datasets, aumento de datos y etiquetado automático.
site_author: Juan David Rivaldo Diaz Sierra

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Módulos:
    - Aumentación de datos: modules/albumentations.md
    - Auto-etiquetado: modules/autolabeling.md
    - Herramientas generales: modules/general.md
    - Procesamiento JSON: modules/json.md
